apiVersion: apps/v1
kind: Deployment
metadata:
  name: volatility-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volatility-inference
  template:
    metadata:
      labels:
        app: volatility-inference
    spec:
      containers:
        - name: inference
          image: your-registry/volatility-inference:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: volatility-inference-svc
spec:
  selector:
    app: volatility-inference
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
