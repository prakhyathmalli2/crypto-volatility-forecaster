apiVersion: apps/v1
kind: Deployment
metadata:
  name: volatility-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volatility-dashboard
  template:
    metadata:
      labels:
        app: volatility-dashboard
    spec:
      containers:
        - name: dashboard
          image: your-registry/volatility-inference:latest
          command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501"]
          env:
            - name: API_URL
              value: http://volatility-inference-svc
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: volatility-dashboard-svc
spec:
  selector:
    app: volatility-dashboard
  ports:
    - port: 80
      targetPort: 8501
  type: LoadBalancer
